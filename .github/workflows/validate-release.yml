name: Validate and Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DCTL structure
        run: python3 ci/validate_dctl.py
      - name: Validate white-point math
        run: python3 ci/test_whitepoint_math.py
      - name: Validate full transform behavior
        run: python3 ci/test_transform_regression.py
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/package
          cp -R dctl scripts README.md SYSTEM.md VALIDATION.md CHANGELOG.md LICENSE dist/package/
          (cd dist/package && sha256sum dctl/*.dctl > SHA256SUMS.txt)
          (cd dist/package && zip -r ../LookLab-WB-${{ github.ref_name }}.zip .)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LookLab-WB-${{ github.ref_name }}.zip
